# Staged npm release with provenance for @truealter/mcp-ollama.
#
# THE CUT IS STAGED, NOT PUBLISHED. A tag push stages the version and a
# maintainer approves it with 2FA before it reaches installers. The reasoning
# sits on the staging step below rather than being repeated here.
#
# Triggers on v*.*.* tag push, and on a hand dispatch, which exists so the MCP
# registry entry can be submitted after an approval that GitHub never sees.
# Pre-requisites for a working release:
#   1. A trusted publisher configured for this package on npmjs.com, naming
#      this repository and this workflow file. There is no secret to set. The
#      ruling is that every ~alter package goes to npm through trusted
#      publishing on GitHub OIDC, with the package's own "require 2FA and
#      disallow tokens" setting on, which closes the token route while
#      leaving OIDC working.
#   2. The npm package is registered under @truealter (run `npm access` once).
#   3. The target version tag is pushed (`git tag -s v0.2.1 && git push --tags`),
#      or created through the API, which is what a machine with `tag.gpgsign`
#      set globally has to do since `git tag` there opens an editor.
#
# Actions are pinned to full commit SHAs, to defend against tag-moving
# supply-chain attacks on the publish path.
#
# Docs: https://docs.npmjs.com/generating-provenance-statements
#       https://docs.npmjs.com/generating-provenance-statements#provenance-limitations

name: Release

on:
  push:
    tags:
      # Exclude pre-release suffixes (v1.0.0-rc1 etc); pre-releases are a separate workflow.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # A staged cut does not reach installers until a maintainer approves it with
  # 2FA, and that approval happens off GitHub, so nothing re-triggers this
  # workflow afterwards. The registry job below cannot run before the version
  # is live, so without a hand trigger the MCP registry entry would never be
  # submitted at all. Every job here stands down idempotently once its work is
  # done, so a dispatch after approval submits the entry and touches nothing
  # else.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mints the OIDC token for trusted publishing and provenance alike

jobs:
  npm:
    # Hosted runner is REQUIRED here, not a preference: npm provenance mints
    # its OIDC token from GitHub's own Actions identity provider, which only
    # issues to GitHub-hosted runners. A self-hosted runner cannot produce
    # that token, so --provenance would fail outright. This repository is
    # public, so unlike a private source repo the registry will accept the
    # attestation once minted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # STAGED PUBLISHING'S FLOOR, WHICH IS HIGHER THAN THE EXCHANGE'S. The
      # OIDC exchange arrived in npm 11.5.1 and run 33718660831 cleared that
      # floor on npm 11.17.0 while still being refused, so the floor was never
      # the fault and raising it is not the fix. `npm stage` needs 11.15.0 or
      # newer, which is why the pin is `latest` rather than `^11.5.1`. The
      # command is asserted rather than assumed: a too-old npm treats `stage`
      # as an unknown argument and fails late with a message about the
      # argument instead of about the version.
      - name: Meet staged publishing's floor
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          node --version
          npm stage --help >/dev/null 2>&1 || {
            echo "::error::release: this npm has no stage command. Needs 11.15.0 or newer."
            exit 1
          }

      - run: npm ci

      # The tag is pushed by hand, so nothing else makes it agree with the
      # manifest. A mismatch publishes one version under another version's
      # name, and npm has no undo: the wrong number is taken forever and the
      # GitHub release below would then be cut against a tag describing a
      # different tree. Cheap to check, impossible to walk back.
      # Skipped on a hand dispatch, where the ref is a branch and there is no
      # tag to agree with anything. The workflow_dispatch trigger exists to
      # submit the registry entry after a staged cut is approved, and by then
      # the tag this step would have checked was already pushed and checked.
      - name: Assert the tag names the version in package.json
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "v${version}" != "${tag}" ]; then
            echo "tag ${tag} does not name package.json version ${version}." >&2
            exit 1
          fi
          echo "tag ${tag} matches package.json ${version}."

      # The server manifest names the npm package AT A VERSION and the MCP
      # registry resolves that identifier. If it lags the manifest, the
      # registry entry points at a version that does not exist yet.
      - name: Assert server.json names the same version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          top=$(node -p "require('./server.json').version")
          pkg=$(node -p "require('./server.json').packages[0].version")
          if [ "$top" != "$version" ] || [ "$pkg" != "$version" ]; then
            echo "server.json carries ${top}/${pkg}, package.json carries ${version}." >&2
            exit 1
          fi
          echo "server.json matches package.json ${version}."

      - run: npm run build

      - name: Pack
        run: npm pack

      # No NODE_AUTH_TOKEN, deliberately. npm reads the OIDC token that
      # id-token: write mints and exchanges it with the registry itself, so
      # nothing long-lived sits on this path and this repository holds no
      # credential to leak.
      #
      # THE CUT IS STAGED, NOT PUBLISHED, AND THAT IS WHAT MAKES IT
      # AUTHENTICATE. Run 33718660831 failed on its publish step, and only on
      # that step, with `403 Forbidden - PUT
      # https://registry.npmjs.org/@truealter%2fmcp-ollama - OIDC permission
      # denied for this action`. The exchange REACHED the registry and was
      # refused THERE, on the action, which is why neither the npm floor above
      # nor the setup-node pin was ever the cause. `true-alter/cli` run
      # 33466878182 staged `@truealter/cli@0.8.43` green on every step from an
      # otherwise identical job, zero repository secrets, the same placeholder
      # NODE_AUTH_TOKEN setup-node writes, the same permissions and no
      # environment, and it is the only shape in this estate observed to
      # authenticate. Anchor: ruling-if-the-sdk-oidc-exchange-is-refused-the-
      # sdk-takes-the-clis-staged-shape-rather-than-a-dashboard-guess-
      # 2026-09-03, applied here on ~blake's own selection of 2026-09-03.
      #
      # IT CHANGES RELEASE SEMANTICS AND THAT IS ACCEPTED. A staged cut is not
      # live until a maintainer approves it with 2FA, so every release now
      # waits on a human. Stated as the cost of the shape rather than
      # discovered afterwards.
      #
      # IDEMPOTENT ON THE LIVE SIDE ONLY. A version already sitting in the
      # stage is not handled, deliberately: `npm stage list`'s output shape
      # has not been observed from this repository, and inventing a parse for
      # it would be a guess in the one step that must not guess. A duplicate
      # stage fails with the registry's own message, which is legible.
      #
      # The version check below is not defensive tidiness, it is what makes
      # the first tag work at all. npm will not show a package's Trusted
      # Publisher section until at least one version exists, so the very
      # first publish of any package can never come from this workflow
      # (npm/cli#8544, open). 0.2.0 was therefore published by hand under
      # 2FA, which mints no token and leaves the trusted-publishing ruling
      # intact, and the publisher was configured afterwards. Without this
      # check the tag that follows that bootstrap dies on EPUBLISHCONFLICT
      # and takes the release cut and the registry submission down with it,
      # because both of those jobs need this one.
      #
      # THE EXCHANGE ASSERTION IS NOT DEBUG RESIDUE. npm attempts the OIDC
      # exchange unconditionally and is written never to throw: every way it
      # can fail returns undefined behind a `log.verbose` line a default run
      # never prints. setup-node writes an .npmrc reading
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and, with no
      # secret to fill it, sets that variable to the literal placeholder
      # XXXXX-XXXXX-XXXXX-XXXXX, so a refused exchange does not stop the step.
      # It falls through to an unauthenticated PUT and the registry answers
      # `404 Not Found - PUT` on a package that is plainly there. That second
      # failure, which describes the retry rather than the fault, cost three
      # sessions across two days on @truealter/sdk.
      #
      # TWO REFUSAL SHAPES, BOTH OBSERVED, AND THIS PACKAGE PRODUCED THE
      # SECOND ONE. @truealter/sdk printed `Failed token exchange request ...
      # package not found` and fell through silently. THIS package was refused
      # with `403 Forbidden - OIDC permission denied for this action`, which
      # is loud but is a different string, so a matcher carrying only the
      # first pattern would have said nothing about our own history. Neither
      # string is invented here.
      #
      # `set -e` is DELIBERATELY ABSENT. With it the step dies on npm's own
      # exit before the capture is read, so the assertion never runs and this
      # whole block is decoration. Anchor: finding-the-sdk-oidc-exchange-404s-
      # package-not-found-while-mcp-ollama-403s-permission-denied-so-the-two-
      # refusals-are-different-and-the-staged-shape-answers-only-one-
      # 2026-09-03, which records this rung as owed.
      - name: Stage the cut for approval, unless this version is already live
        run: |
          set -uo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@truealter/mcp-ollama@${version}" version >/dev/null 2>&1; then
            echo "@truealter/mcp-ollama@${version} is already on npm. Skipping."
            exit 0
          fi
          tarball=$(ls truealter-mcp-ollama-*.tgz)
          status=0
          npm stage publish "$tarball" --access public --provenance --tag latest \
            --loglevel verbose > stage.log 2>&1 || status=$?
          cat stage.log
          if grep -qE 'Failed token exchange request|OIDC permission denied' stage.log; then
            line=$(grep -m1 -E 'Failed token exchange request|OIDC permission denied' stage.log)
            echo "::error::release: the registry REFUSED the OIDC exchange, so any status below describes npm's unauthenticated retry rather than the fault. ${line}"
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "release: staged ${version} with tag latest. It is NOT live until approved with 2FA."
          fi
          exit "$status"

      - name: Say what is now waiting on a human
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@truealter/mcp-ollama@${version}" version >/dev/null 2>&1; then
            exit 0
          fi
          {
            echo "### @truealter/mcp-ollama ${version} is staged, not published"
            echo
            echo "It reaches installers only when you approve it with 2FA:"
            echo
            echo '```'
            echo "npm stage list @truealter/mcp-ollama"
            echo "npm stage view <stage-id>       # inspect before approving"
            echo "npm stage approve <stage-id>    # prompts for 2FA, publishes"
            echo "npm stage reject <stage-id>     # discard"
            echo '```'
            echo
            echo "Then re-run this workflow from the Actions tab to submit the MCP registry entry."
          } >> "$GITHUB_STEP_SUMMARY"

  github_release:
    # A reader who arrives from the npm listing lands on this repository, and
    # until now it has carried no tags and no releases, so the page looked
    # like nothing had ever been cut from it.
    #
    # Separate job rather than a step in the job above, so contents: write
    # sits only where a release is created and the job holding the identity
    # that reaches the registry keeps contents read-only.
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Cut the release
        # Idempotent. A re-run on a version already cut stands down rather
        # than failing the workflow.
        #
        # The tag is derived from package.json rather than from
        # GITHUB_REF_NAME, because a hand dispatch runs on a branch and that
        # variable would then read `main`. On a tag run the assertion in the
        # npm job has already proved the two agree, so this is the same value
        # by a route that survives both triggers.
        #
        # The release is cut even though the npm cut is only STAGED. The tag
        # records which source was cut, which is true the moment the tag lands
        # and stays true whether or not the stage is approved, and the body
        # says plainly that installers do not have it yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release: ${tag} already exists, nothing to cut."
            exit 0
          fi
          if npm view "@truealter/mcp-ollama@${version}" version >/dev/null 2>&1; then
            state="is on npm, with provenance."
          else
            state="is staged on npm and reaches installers when a maintainer approves it with 2FA."
          fi
          notes=$(mktemp)
          {
            echo "\`@truealter/mcp-ollama@${version}\` ${state}"
            echo
            echo '```'
            echo "npm install -g @truealter/mcp-ollama"
            echo '```'
            # This version's CHANGELOG section, keyed on the VERSION rather
            # than on position. Keying on position takes the newest section,
            # which is `## [Unreleased]`, so every cut would carry the notes
            # for work that is not in it.
            if [ -f CHANGELOG.md ]; then
              body=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## /{exit} f{print}' CHANGELOG.md)
              if [ -n "$body" ]; then
                echo
                echo "$body"
              fi
            fi
          } > "$notes"
          gh release create "$tag" --title "$tag" --notes-file "$notes" --target "${GITHUB_SHA}"
          echo "release: cut ${tag} at ${GITHUB_SHA}."

      - name: Correct the notes once the stage is approved
        # A release cut against a staged version says installers do not have
        # it yet, and that sentence stops being true the moment somebody
        # approves the stage. Nothing else would ever go back and fix it, so
        # the hand dispatch that submits the registry entry repairs the page a
        # reader actually lands on. Runs only when the release exists AND the
        # version is live AND the body still carries the staged sentence.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          gh release view "$tag" >/dev/null 2>&1 || exit 0
          npm view "@truealter/mcp-ollama@${version}" version >/dev/null 2>&1 || exit 0
          body=$(gh release view "$tag" --json body --jq '.body')
          case "$body" in
            *"approves it with 2FA"*) ;;
            *) echo "release: ${tag} notes already read as live, nothing to correct."; exit 0 ;;
          esac
          printf '%s\n' "$body" \
            | sed 's/is staged on npm and reaches installers when a maintainer approves it with 2FA\./is on npm, with provenance./' \
            > corrected-notes.md
          gh release edit "$tag" --notes-file corrected-notes.md
          echo "release: ${tag} notes corrected to say the version is live."

  registry:
    # The registry entry names the npm package at a version, so it cannot be
    # submitted before that version exists. Gating on the npm job is what
    # orders the two; without it a fast submit races its own package and the
    # registry rejects an identifier it cannot resolve.
    #
    # STAGING BREAKS THAT ORDERING AND THE GUARD BELOW IS WHY IT IS SAFE. The
    # npm job now stages rather than publishes, so it goes green while the
    # version is still not resolvable, and a submit on that run would be
    # rejected for an identifier the registry genuinely cannot see. The guard
    # stands the job down instead of failing it, and the hand dispatch after
    # approval is what actually submits.
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # mcp-publisher's github-oidc provider exchanges this for a registry
      # token. It proves the workflow runs in a repository owned by
      # true-alter, which is what authorises the io.github.true-alter
      # namespace. No secret, same posture as the job above.
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Is the version this entry names actually live yet
        id: live
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@truealter/mcp-ollama@${version}" version >/dev/null 2>&1; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "registry: ${version} is live, submitting the entry."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "registry: ${version} is staged, not live. The entry names a version the registry cannot resolve, so this stands down."
            {
              echo "### MCP registry entry NOT submitted"
              echo
              echo "\`@truealter/mcp-ollama@${version}\` is staged, not live, so the registry cannot resolve it."
              echo "Approve the stage with 2FA, then re-run this workflow from the Actions tab."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch mcp-publisher
        if: steps.live.outputs.live == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
        env:
          # Pinned, not latest. An unpinned release download makes every run
          # depend on whatever the registry shipped that morning.
          MCP_PUBLISHER_VERSION: v1.8.1
          # A tag is mutable and can be moved to different bytes, so the tag
          # alone is not a pin. This job holds id-token: write and executes what
          # it downloads, which is the case where that distinction is worth the
          # line. Digest measured from the published asset on 2026-09-01.
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

      - name: Submit the entry
        if: steps.live.outputs.live == 'true'
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
